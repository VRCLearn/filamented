name: Build VPM repository listing

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/build-listing.yml
      - .github/scripts/build_vpm_listing.py
      - Website/**
      - source.json
  workflow_dispatch:
  release:
    types:
      - created
      - deleted
      - edited
      - published
      - released
      - unpublished

permissions: {}

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  request-release-refresh:
    name: Queue a default-branch Pages refresh
    if: github.event_name == 'release'
    permissions:
      actions: write
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch the listing workflow on the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run build-listing.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$DEFAULT_BRANCH"

  build:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the mirror
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Check out the official VPM website template
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: vrchat-community/template-package
          ref: 591e23fe5175b8279cc3998f65e81add604aabc9
          path: official-template

      - name: Check out the official VPM listing renderer
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: vrchat-community/package-list-action
          ref: cb31c3b5d17d1070d7741c61de2ca1b219224039
          path: ci

      - name: Render the official VPM listing website
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp source.json official-template/source.json
          ci/build.cmd BuildRepoListing \
            --root ci \
            --package-listing-source-folder "$GITHUB_WORKSPACE/official-template" \
            --list-publish-directory "$GITHUB_WORKSPACE/official-template/Website" \
            --current-package-name s-ilent.filamented \
            --current-listing-url "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/.vpm-empty-index.json"

      - name: Build the VPM listing
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python .github/scripts/build_vpm_listing.py \
            --config source.json \
            --output official-template/Website/dist \
            --website official-template/Website

      - name: Ensure at least one package version exists
        run: |
          package_count="$(jq '[.packages[]?.versions | length] | add // 0' official-template/Website/dist/index.json)"
          if [[ "$package_count" == "0" ]]; then
            echo "No VPM package release was found." >&2
            exit 1
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload the GitHub Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: official-template/Website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
